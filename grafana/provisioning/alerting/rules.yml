            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: probe_success == 0
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "{{ $labels.instance }} is not responding", __dashboardUid__: "samoylove-overview", __panelId__: "28" }

      - uid: infra-certificate-expiring-soon
        title: CertificateExpiringSoon
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
