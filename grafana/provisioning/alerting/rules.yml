      - uid: product-status-cert-renewal-missed
        title: CertRenewalMissed
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 43200, to: 0 }
            model:
              expr: 'min by (project) (status_cert_days_left) < 25'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 6h
        labels: { severity: warning }
        annotations: { summary: "A certificate was not renewed at 30 days left", description: "Certbot продлевает за 30 дней до конца; меньше 25 — продление сломано. Так 19.09.2026 нашёлся launcher: certbot.service падал молча месяц. Смотреть journalctl -u certbot в контейнере web." }

  - orgId: 1
    name: product-snakes
    folder: Alerts
    interval: 1m
    rules:
      - uid: product-snakes-profiles-read-only
        title: SnakesProfilesReadOnly
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: snakes_profiles_read_only == 1
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "Snakes profile storage is read-only — player progress will not survive a restart", __dashboardUid__: "samoylove-snakes", __panelId__: "27" }

      - uid: product-snakes-profile-saves-failing
        title: SnakesProfileSavesFailing
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: increase(snakes_profiles_save_errors_total[30m]) > 0
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "Snakes cannot write profiles.json — progress is being lost", __dashboardUid__: "samoylove-snakes", __panelId__: "28" }

      - uid: product-snakes-ws-errors-high
        title: SnakesWsErrorsHigh
        condition: C
        data:
          - refId: A
            # Порог не откалиброван по реальным данным — начальная прикидка.
            # Если начнёт шуметь или, наоборот, молчать при заметных разрывах,
            # число 10 в минуту стоит пересмотреть по факту, а не вслепую.
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: |
                60 * (
                  sum(rate(snakes_ws_dropped_messages_total[10m]))
                    +
                  sum(rate(snakes_ws_write_errors_total[10m]))
                    +
                  sum(rate(snakes_ws_handshake_rejected_total[10m]))
                ) > 10
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "More than 10 WebSocket failures per minute — players are getting dropped", __dashboardUid__: "samoylove-snakes", __panelId__: "23" }

      - uid: product-snakes-tick-slow
        title: SnakesTickSlow
        condition: C
        data:
          - refId: A
            # 100ms — прикидка бюджета тика, не измеренный факт. Как и порог
            # выше, стоит сверить с реальным p95 после недели наблюдений.
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: histogram_quantile(0.95, sum(rate(snakes_tick_duration_seconds_bucket[10m])) by (le)) > 0.1
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Game tick p95 is over budget — every player feels the lag", __dashboardUid__: "samoylove-snakes", __panelId__: "29" }

      - uid: product-snakes-tick-rate-low
        title: SnakesTickRateLow
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 1200, to: 0 }
            model:
              expr: 'sum(rate(snakes_tick_duration_seconds_count[5m])) / sum(avg_over_time(snakes_rooms[5m])) < 9 and on() sum(avg_over_time(snakes_rooms[5m])) > 0'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Snakes rooms tick below 9 per second", description: "Сервер пропускает тики: игра идёт медленнее реального времени. SnakesTickSlow смотрит только на длительность тика и может молчать." }

      - uid: product-snakes-ws-abnormal-closes
        title: SnakesWsAbnormalCloses
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 1200, to: 0 }
            model:
              expr: 'sum(rate(snakes_ws_closed_total{reason=~"panic|write_error|send_backpressure"}[10m])) * 60 > 1'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Snakes WebSocket connections close abnormally", description: "Соединения игроков рвутся по нашей вине (паника, ошибка записи, переполнение очереди отправки) чаще раза в минуту." }

      - uid: product-snakes-ws-panic
        title: SnakesWsPanic
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 1200, to: 0 }
            model:
              expr: 'sum(increase(snakes_ws_closed_total{reason="panic"}[10m])) > 0'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 0m
        labels: { severity: warning }
        annotations: { summary: "Snakes connection handler panicked", description: "Паника в обработчике соединения — ошибка в коде, а не нагрузка. Журнал snakes.service." }

      - uid: product-snakes-matches-stalled
        title: SnakesMatchesStalled
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 1800, to: 0 }
            model:
              expr: 'sum(snakes_matches_running) > 0 and on() sum(increase(snakes_matches_total[15m])) == 0'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 0m
        labels: { severity: warning }
        annotations: { summary: "Snakes matches are running but none finished in 15 minutes", description: "Матч идёт по таймеру 5 минут; если матч «идёт» 15 минут и ни один не закончился — комната зависла." }

  # ═══════════════════════════════════════════════════════════════════════════
  # РАЗБОР МАТЧЕЙ CS2 — ЕДИНСТВЕННАЯ ГРУППА ПРАВИЛ ПО-РУССКИ, И ЭТО РЕШЕНИЕ
  # ВЛАДЕЛЬЦА ОТ 10.09.2026.
  #
  # Остальные группы выше остались на английском (см. шапку файла). Здесь
  # иначе: имя правила и текст — это то, что человек читает в чате ночью, и
  # читать он должен не «Cs2ChainStalled», а что именно сломалось и что от
  # этого не работает у игрока.
  #
  # У КАЖДОГО ПРАВИЛА ДВА ТЕКСТА, И ОНИ РАЗНЫЕ ПО НАЗНАЧЕНИЮ:
  #   summary     — что произошло, одной строкой;
  #   description — ЧТО ЭТО ЗНАЧИТ ДЛЯ ИГРОКА и что делать.
  # Второе важнее первого. Тревога, из которой не видно последствия, требует
  # похода в код, чтобы понять, надо ли вставать; а тревога, по которой не
  # встают, через месяц выключается вместе со всеми остальными.
  #
  # ЧЕГО ЗДЕСЬ НАМЕРЕННО НЕТ:
  #   • тревоги на cs2_chain_demos_expired — истёкшие демки лечению не
  #     подлежат, это учёт потерянного, а не повод будить. Смотреть вперёд
  #     обязана «Демки вот-вот исчезнут у Valve», у которой ещё есть время;
  #   • тревоги на лабораторный режим — он включён владельцем осознанно, и
  #     напоминать о нём каждые сутки значит приучить не читать;
  #   • тревоги на «профиль закрыт» в ответах Steam — это нормальный ответ
  #     про обычного человека с обычными настройками приватности.
  #
  # Демки хранятся ЦЕЛИКОМ, ретеншна нет: это осознанное решение, а не
  # недоделка. Значит место кончится, и единственная защита от того, чтобы это
  # случилось внезапно, — предупредить заранее. Датасет ограничен квотой ZFS,
  # поэтому переполнение остановит приём демок, а не заполнит общий пул, на
  # котором живут прод и сборочные машины.
  - orgId: 1
    name: product-cs2
    folder: Alerts
    interval: 1m
    rules:
      - uid: cs2-api-down
        title: "CS2: сайт не отвечает"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: 'up{job="cs2-api"} == 0'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "Служба cs2-api не отвечает на сбор метрик", description: "Для игрока это полностью недоступный сайт: ни разбора, ни истории, ни входа. Смотреть journalctl -u cs2-api в контейнере cs2; выкатка откатывается сама, если не поднялся healthz.", __dashboardUid__: "samoylove-cs2", __panelId__: "100" }
      - uid: cs2-not-ready
        title: "CS2: сервис не подключился к базам"
        condition: C
        data:
          - refId: A
            # Порт слушается раньше баз намеренно — иначе медленный ClickHouse
            # откатывал бы исправный релиз. Отсюда и правило: «не готов» это
            # состояние, а не отсутствие сервиса.
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: 'cs2_ready == 0'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: critical }
        annotations: { summary: "Сайт поднят, но Postgres или ClickHouse недоступны", description: "Человек видит страницу «сервис поднимается» и 503 везде, где нужны данные: разбор, профиль, поиск. Само чинится, когда база встанет; дольше десяти минут — значит база не поднимется без нас. Причина названа словами в /readyz.", __dashboardUid__: "samoylove-cs2", __panelId__: "402" }
      - uid: cs2-http-errors
