                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "В одной партиции ClickHouse больше 200 кусков", description: "На трёхсотом куске ClickHouse отказывает в любой вставке, и разбор встаёт. Обычно это значит, что слияния не успевают за мелкими вставками. Смотреть system.parts и system.merges." }

      - uid: cs2-erasure-overdue
        title: "CS2: просьба стереть данные ждёт дольше суток"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: 'cs2_erasure_pending_overdue > 0'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
