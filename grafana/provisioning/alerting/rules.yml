        annotations: { summary: "Работник {{ $labels.worker }} давно не отметил ни одного удачного круга", description: "Сайт отвечает, но данные этого работника перестали свежеть: блокировки, уровни и профили — наблюдения о встреченных и профили игроков; faceit — ELO на профилях; друзья — матчи через бота в друзьях приходят только кругом кодов, с опозданием; пересчёт — старые числа на страницах после смены разбора; аватары — кэш аватаров растёт без уборки. Смотреть журнал cs2-chain (у аватаров — cs2-api) по имени работника: круг падает молча или обрывается отказом чужой стороны.", __dashboardUid__: "samoylove-cs2", __panelId__: "401" }
