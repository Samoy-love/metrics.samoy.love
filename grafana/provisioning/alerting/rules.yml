      - uid: infra-probe-latency-high
        title: ProbeLatencyHigh
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: probe_duration_seconds > 3
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
