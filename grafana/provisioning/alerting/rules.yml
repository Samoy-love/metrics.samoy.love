          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 30m
        labels: { severity: warning }
        annotations: { summary: "Launcher telemetry is being rate limited", description: "Ограничитель частоты отбрасывает телеметрию лаунчеров (429). TelemetryRejected этого не видит: 429 не попадает в chillhub_telemetry_rejected_total." }

      - uid: product-chillhub-admin-login-failures
        title: ChillhubAdminLoginFailures
        condition: C
