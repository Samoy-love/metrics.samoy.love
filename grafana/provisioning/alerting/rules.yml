# Правила алертинга: инфраструктура и продуктовые метрики. Раньше это были
# prometheus/rules/infra.yml и product.yml, уходившие в отдельный Alertmanager
# (см. историю docker-compose.yml) — теперь Grafana сама и вычисляет правила,
# и шлёт в Telegram через grafana/provisioning/alerting/contactpoints.yml.
# Имена правил и текст summary — на английском, как и раньше: это то, что
# видно в UI, в API и в сообщении бота.
#
# ПОЧЕМУ У КАЖДОГО ПРАВИЛА УСЛОВИЕ "gt -1e9", А НЕ ПОРОГ ИЗ SUMMARY. Исходные
# PromQL-выражения — это фильтры Prometheus (`x < 0.10`, `x == 0`, `x == 1`):
# они возвращают ряд, только когда условие уже верно, а его ЗНАЧЕНИЕ при этом
# может быть чем угодно — долей от 0 до 1, точным нулём (`== 0`), единицей
# (`== 1`) или отрицательным числом (просроченный сертификат). Grafana же
# требует отдельный узел-условие, который сравнивает ЗНАЧЕНИЕ. Порог в
# -1 000 000 000 ниже любого реального значения во всех выражениях ниже, так
# что условие эквивалентно исходному «ряд есть — значит, авария»: считать
# срабатыванием сам факт, что фильтр Prometheus что-то вернул, а не то, что
# вернувшееся число больше нуля (иначе `== 0` никогда бы не сработало).
#
# ЧЕГО ЗДЕСЬ НЕТ. AlertmanagerDown и AlertNotificationsFailing (были в
# infra-alerting) не перенесены: обе проверяли отдельный Alertmanager, а его
# в стеке больше нет — Grafana теперь и вычисляет правила, и доставляет
# сообщения сама, так что проверять «жив ли Alertmanager» больше нечего.
# Самой Grafana, если она недоступна, тоже некому будет об этом сообщить —
# та же дыра, что была описана в исходном комментарии infra-alerting, и её
# закрывает внешняя проверка GitHub Actions (.github/workflows/ci.yml), а не
# правило внутри самого стека.
#
# inhibit_rules из alertmanager.yml (SiteDown гасит ProbeLatencyHigh по тому
# же instance, critical гасит warning по тому же alertname+instance) тоже не
# перенесены: у Grafana Alerting нет прямого аналога подавления одного
# алерта другим на уровне политики маршрутизации. Из трёх алертов про один
# упавший сайт (SiteDown, ProbeLatencyHigh, возможно SiteErrorRateHigh) в чат
# теперь придёт больше одного сообщения.

apiVersion: 1

# ПЕРЕИМЕНОВАНИЕ uid ПЛОДИТ ДУБЛИКАТ, А НЕ ЗАМЕНЯЕТ ПРАВИЛО.
#
# Выяснено на себе 10.09.2026, через семь минут после выкатки. Группа
# product-cs2 была переписана целиком, и вместе с текстами поменялись uid пяти
# правил. Grafana НЕ удаляет правила, которых не стало в файле: она завела
# новые, а старые остались в своей базе и продолжили слать в чат — старым
# английским именем и со старым, уже неверным порогом. То есть починка ложной
# тревоги ровно её и не починила бы, а вдобавок удвоила бы остальные.
#
# Отсюда два следствия. Первое: uid — это идентификатор, а не описание, и
# менять его при правке текста незачем. Второе: если он всё же поменялся,
# старый обязан быть назван здесь — другого способа убрать правило из Grafana,
# кроме как сказать об этом вслух, у провижининга нет.
deleteRules:
  - orgId: 1
    uid: cs2-demo-downloads-failing
  - orgId: 1
    uid: cs2-gc-disconnected
  - orgId: 1
    uid: cs2-parse-failing
  - orgId: 1
    uid: cs2-summaries-unparsed
  - orgId: 1
    uid: cs2-codes-need-rebind
  # Это осталось от ещё более раннего захода: правило про медленный разбор
  # заводилось с uid, начинающимся с имени группы. Найдено сверкой списков, а
  # не глазами: глазами я нашёл только пять, шестое отличалось приставкой.
  - orgId: 1
    uid: product-cs2-parse-slow

groups:
  - orgId: 1
    name: infra-host
    folder: Alerts
    interval: 1m
    rules:
      - uid: infra-disk-space-low
        title: DiskSpaceLow
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.10
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: critical }
        annotations: { summary: "Less than 10% free space left on /", __dashboardUid__: "samoylove-overview", __panelId__: "18" }

      - uid: infra-memory-low
        title: MemoryLow
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              # Только хост: node_exporter внутри web видит ту же память хоста, и без
              # фильтра тревога приходила дважды (22.09.2026: 58 раз в Pending за неделю).
              expr: node_memory_MemAvailable_bytes{job="node-host"} / node_memory_MemTotal_bytes{job="node-host"} < 0.15
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "Less than 15% of host memory available", __dashboardUid__: "samoylove-hardware", __panelId__: "16" }

      - uid: infra-cpu-saturated
        title: CpuSaturated
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              # Только хост: node_exporter внутри web читает /proc хоста, и без фильтра
              # одна и та же загрузка приходила двумя тревогами.
              expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{job="node-host",mode="idle"}[5m])) * 100) > 90
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 30m
        labels: { severity: warning }
        annotations: { summary: "Host CPU above 90% for half an hour", __dashboardUid__: "samoylove-hardware", __panelId__: "15" }

      - uid: infra-node-rebooted
        title: NodeRebooted
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              # for отсутствует не по забывчивости: сама метрика гасит себя —
              # условие ложно уже через 5 минут после старта, держать
              # отдельную задержку незачем.
              # Только хост: время загрузки у web то же самое (общее ядро), и
              # перезагрузка приходила двумя одинаковыми тревогами.
              expr: time() - node_boot_time_seconds{job="node-host"} < 300
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 0s
        labels: { severity: warning }
        annotations: { summary: "Server rebooted less than 5 minutes ago", __dashboardUid__: "samoylove-hardware", __panelId__: "62" }

      - uid: infra-network-errors-high
        title: NetworkErrorsHigh
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: |
                rate(node_network_receive_errs_total{device!~"lo|veth.*|docker.*|br-.*"}[5m])
                  +
                rate(node_network_transmit_errs_total{device!~"lo|veth.*|docker.*|br-.*"}[5m])
                  > 0
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Network interface {{ $labels.device }} is dropping packets with errors", __dashboardUid__: "samoylove-overview", __panelId__: "36" }

  # Железо и инфраструктура хоста. Появилось вместе со вторым node_exporter,
  # который стоит на самом хосте: стек метрик живёт в контейнере web и до
  # датчиков не достаёт. Пороги взяты из фактических замеров и из CLAUDE.md,
  # а не из общих соображений:
  #
  #   * 92 °C у CPU — под полной нагрузкой на 16 потоков сервер устойчиво
  #     держит 88–89 °C без троттлинга, так что 92 — это уже отклонение,
  #     а не штатная работа (предел кристалла 95 °C);
  #   * 65 °C у памяти — ровно та граница, за которой в CLAUDE.md предписано
  #     ослабить tRFC с 600 до 700–800: значение тюнерское, и отказ из-за него
  #     наступает именно при росте температуры;
  #   * ошибки ZFS вынесены в critical, потому что ECC на 8700G нет и ошибки
  #     памяти здесь молчаливые — контрольные суммы пула остаются единственным
  #     способом заметить порчу данных.
  - orgId: 1
    name: infra-hardware
    folder: Alerts
    interval: 1m
    rules:
      - uid: hw-cpu-temp-high
        title: CPUTemperatureHigh
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              # 95 °C у 8700G — штатный предел (Tjmax): под нагрузкой процессор держит
              # его сам, сбрасывая частоту, и прежний порог 92 горел на каждом
              # тяжёлом прогоне CI. За неделю до 22.09.2026 при 94 °C и выше
              # средняя частота ни разу не падала ниже 4,49 ГГц (медиана 4,72) —
              # выше базовых 4,2. Беда начинается, когда предела не хватает:
              # пятнадцать минут у предела И частота ниже базовой (охлаждение
              # не справляется и отнимает производительность), либо выше 97 °C
              # (защита не удерживает предел).
              expr: '(min_over_time((node_hwmon_temp_celsius * on(chip) group_left(chip_name) node_hwmon_chip_names{chip_name="k10temp"})[15m:1m]) >= 94 and on() avg(avg_over_time(node_cpu_scaling_frequency_hertz{job="node-host"}[15m])) < 4.2e9) or max_over_time((node_hwmon_temp_celsius * on(chip) group_left(chip_name) node_hwmon_chip_names{chip_name="k10temp"})[5m:1m]) > 97'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: critical }
        annotations: { summary: "CPU is throttling below base clock at its 95 C limit, or above 97 C", description: "Процессор 15 минут у предела 95 °C и при этом ниже базовой частоты 4,2 ГГц — охлаждение не справляется и отнимает производительность; или температура выше 97 °C — защита не удерживает предел. Штатный упор в 95 °C при нагрузке на полной частоте тревогой не считается. Проверить обороты кулера и пыль, график частоты — «Железо».", __dashboardUid__: "samoylove-hardware", __panelId__: "9" }

      - uid: hw-dimm-temp-high
        title: MemoryTemperatureHigh
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: node_hwmon_temp_celsius * on(chip) group_left(chip_name) node_hwmon_chip_names{chip_name="spd5118"} > 65
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "DDR5 module above 65C: loosen tRFC from 600 to 700-800" }

      - uid: hw-nvme-temp-high
        title: NVMeTemperatureHigh
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: node_hwmon_temp_celsius{sensor="temp1"} * on(chip) group_left(chip_name) node_hwmon_chip_names{chip_name="nvme"} > 70
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "NVMe above 70C, controller starts throttling" }

      - uid: hw-cpu-fan-stopped
        title: CPUFanStopped
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: node_hwmon_fan_rpm{sensor="fan2"} == 0
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "CPU cooler fan reports 0 RPM" }

      - uid: hw-zpool-unhealthy
        title: ZpoolNotHealthy
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: zpool_health_state != 0
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "ZFS pool is not ONLINE: mirror degraded" }

      - uid: hw-zpool-errors
        title: ZpoolErrors
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: zpool_device_errors_total > 0
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "ZFS reports device errors: no ECC on this box, checksums are the only corruption signal" }

      - uid: hw-nvme-media-errors
        title: NVMeMediaErrors
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: smart_nvme_media_errors_total > 0
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "SMART reports unrecoverable media errors, plan disk replacement" }

      - uid: hw-nvme-wear-high
        title: NVMeWearHigh
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: smart_nvme_percentage_used_ratio > 0.8
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 1h
        labels: { severity: warning }
        annotations: { summary: "NVMe wear above 80% of rated endurance" }

      - uid: hw-host-unit-down
        title: HostUnitInactive
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: node_systemd_unit_state{instance="srv-host",state="active",name=~"(incus|web-isolation|ci-isolation|win-isolation|wan-shaper|fail2ban|ci-autoscaler|ci-scaleset)\\.service"} == 0
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: critical }
        annotations: { summary: "Host infrastructure unit is not active (isolation, shaper or incus)" }

      - uid: hw-hw-metrics-missing
        title: HardwareMetricsMissing
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: up{job="node-host"} == 0
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "Host node_exporter is unreachable: hardware metrics stopped" }

      - uid: hw-incus-metrics-missing
        title: IncusMetricsMissing
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: up{job="incus"} == 0
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "Incus metrics endpoint is unreachable: per-instance metrics stopped" }

      - uid: hw-smart-collect-failing
        title: SmartCollectFailing
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: smart_collect_ok == 0 or zpool_collect_ok == 0 or host_oom_collect_ok == 0
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 30m
        labels: { severity: warning }
        annotations: { summary: "SMART/ZFS/OOM textfile collector is failing, disk health or host OOM is unknown" }

      - uid: hw-instance-oom-kills
        title: InstanceOOMKills
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 1800, to: 0 }
            model:
              expr: 'increase(incus_memory_OOM_kills_total{name!~"ci-(runner|light).*"}[15m]) > 0'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 0m
        labels: { severity: warning }
        annotations: { summary: "A process was killed by the out-of-memory killer inside an instance", description: "Процесс убит за нехватку памяти в инстансе (метка name): он умер молча, и то, что он делал, не доехало. Разбор 19.09.2026: все 17 убийств в web — это Chromium рендерера скриншотов с лимитом 512 МБ, шесть в cs2-render — старый потолок игры, поднятый с тех пор. Считается increase, а не changes: у одноразовых раннеров счётчик обнуляется на каждом задании, поэтому они исключены по имени — и большие ci-runner, и лёгкие ci-light. Нарочные потолки внутри cs2 (работник, разбор демки под limitmem) метрика Incus отличить не умеет — для этого нужен сбор по cgroup." }

      - uid: hw-swap-in-use
        title: SwapInUse
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 3600, to: 0 }
            model:
              expr: '(node_memory_SwapTotal_bytes{job="node-host"} - node_memory_SwapFree_bytes{job="node-host"}) > 2*1024^3'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 30m
        labels: { severity: warning }
        annotations: { summary: "Host uses more than 2 GiB of swap", description: "Хост вытеснил в swap больше 2 ГиБ: памяти не хватает. Фон — 0,1–0,2 ГиБ; 14–16.09.2026 было 6,5 ГиБ, и MemoryLow при этом молчал. Сумма лимитов инстансов вдвое больше физической памяти, поэтому лечится уменьшением лимитов тех, кто их не использует." }

      - uid: hw-memory-pressure
        title: HostMemoryPressure
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 900, to: 0 }
            model:
              expr: 'rate(node_pressure_memory_stalled_seconds_total{job="node-host"}[5m]) > 0.05'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Host tasks stall on memory more than 5% of the time", description: "Все задачи хоста больше 5% времени ждут память (PSI). За неделю до 19.09.2026 максимум был 7,7%. Кто съел — панель «Память инстансов» на дашборде железа; частый виновник — cs2-render с открытой игрой." }

      - uid: hw-host-global-oom
        title: HostGlobalOOM
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 1800, to: 0 }
            model:
              expr: 'increase(host_global_oom_kills_total{job="node-host"}[15m]) > 0'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 0m
        labels: { severity: critical }
        annotations: { summary: "The kernel killed a process because the whole host ran out of memory", description: "Ядро убило процесс из-за нехватки памяти на всём хосте, а не внутри потолка инстанса: жертвой мог стать Postgres или ClickHouse прода. InstanceOOMKills такое не видит — он считает только счётчики инстансов. Считается по строкам ядра oom-kill с global_oom (node-textfile-collect): node_vmstat_oom_kill растёт и от потолка контейнера, и 22.09.2026 так ложно сработал на рендерере Grafana. 21.09.2026 так было дважды (steamwebhelper, процессы раннеров). Кто съел — HostMemoryPressure и панель «Память инстансов»; журнал — journalctl -k | grep global_oom." }

      - uid: hw-zpool-capacity-high
        title: ZpoolCapacityHigh
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 900, to: 0 }
            model:
              expr: 'zpool_capacity_ratio{job="node-host"} > 0.8'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 30m
        labels: { severity: warning }
        annotations: { summary: "ZFS pool is more than 80% full", description: "Пул заполнен больше чем на 80 %: у ZFS после этого падает скорость записи и растёт фрагментация. DiskSpaceLow смотрит только корень хоста (ext4), пул он не видит. Смотреть zfs list -o space: снимки sanoid, квоты демок и клипов, диск cs2-win." }

      - uid: hw-zpool-capacity-critical
        title: ZpoolCapacityCritical
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 900, to: 0 }
            model:
              expr: 'zpool_capacity_ratio{job="node-host"} > 0.9'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: critical }
        annotations: { summary: "ZFS pool is more than 90% full", description: "Пул заполнен больше чем на 90 %: до остановки записи на всех контейнерах недалеко. Освобождать место сейчас: старые снимки, кэш CI (/srv/ci-cache), тома игр." }

      - uid: hw-smart-unhealthy
        title: SmartDeviceUnhealthy
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 900, to: 0 }
            model:
              expr: 'smart_device_healthy{job="node-host"} == 0'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 0m
        labels: { severity: critical }
        annotations: { summary: "A disk reports SMART failure", description: "SMART диска (метка device, model) сообщил, что он неисправен. Пул — зеркало из двух NVMe, второй держит данные, но замену надо планировать сразу: корень хоста лежит только на Kingston без зеркала." }

      - uid: hw-io-pressure
        title: HostIOPressure
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 1200, to: 0 }
            model:
              expr: 'rate(node_pressure_io_stalled_seconds_total{job="node-host"}[5m]) > 0.15'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "Host tasks stall on disk IO more than 15% of the time", description: "Все задачи хоста больше 15% времени ждут диск (PSI): упор в NVMe. За неделю до 19.09.2026 максимум был 6%. Смотреть занятость NVMe и запись по инстансам." }

      - uid: hw-swap-thrashing
        title: SwapThrashing
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 900, to: 0 }
            model:
              expr: 'rate(node_vmstat_pswpin{job="node-host"}[5m]) > 1000 and rate(node_vmstat_pswpout{job="node-host"}[5m]) > 1000'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Host is swapping in and out continuously", description: "Страницы одновременно и вытесняются в swap, и читаются обратно — памяти не хватает прямо сейчас, всё тормозит. Swap за неделю до 19.09.2026 бывал занят до 7 из 8 ГиБ." }

      - uid: hw-zpool-scrub-overdue
        title: ZpoolScrubOverdue
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 7200, to: 0 }
            model:
              expr: 'zpool_scrub_age_seconds > 40*86400'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 1h
        labels: { severity: warning }
        annotations: { summary: "Monthly ZFS scrub has not completed for 40 days", description: "Ежемесячный scrub пула пропущен (таймер zfs-scrub-monthly@tank). Без него тихая порча данных на диске не обнаруживается." }

      - uid: hw-nvme-spare-low
        title: NVMeSpareLow
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 7200, to: 0 }
            model:
              expr: 'smart_nvme_available_spare_ratio < 0.2'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 1h
        labels: { severity: warning }
        annotations: { summary: "NVMe spare blocks below 20%", description: "Резерв запасных блоков NVMe кончается — диск начал активно заменять изношенные ячейки. Готовить замену диска." }

      - uid: hw-nvme-write-rate-high
        title: NVMeWriteRateHigh
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 7200, to: 0 }
            model:
              expr: 'increase(smart_nvme_written_bytes_total[1d]) > 1.1e12'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 1h
        labels: { severity: warning }
        annotations: { summary: "NVMe writes above 1.1 TB per day", description: "При такой записи ресурс Kingston (1000 ТБ) уйдёт меньше чем за 2,5 года. 19.09.2026 было около 437 ГБ в сутки на диск. Искать, кто пишет: запись по инстансам и датасетам." }

      - uid: hw-win-exporter-down
        title: WindowsExporterDown
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 900, to: 0 }
            model:
              expr: 'up{job="cs2-win"} == 0 or absent(up{job="cs2-win"})'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "windows_exporter on cs2-win is not answering", description: "Prometheus не достучался до windows_exporter на Windows-машине рендера пять минут: машина выключена, зависла или служба экспортёра встала. Рендер движком HLAE при этом тоже, скорее всего, стоит. Экран — vmview на хосте, службы — ssh render@cs2-win.", __dashboardUid__: "samoylove-hardware", __panelId__: "64" }

      - uid: hw-gpu-collect-failing
        title: GPUCollectFailing
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 900, to: 0 }
            model:
              expr: 'nvidia_smi_collect_ok{job="cs2-win"} == 0'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "nvidia-smi on cs2-win has been failing for 10 minutes", description: "Опрос GTX 1080 Ti через nvidia-smi не удаётся десять минут: драйвер отвалился или карта пропала из виртуалки после перезагрузки хоста. Рендер на GPU в таком состоянии не пойдёт.", __dashboardUid__: "samoylove-hardware", __panelId__: "65" }

      - uid: hw-gpu-temp-high
        title: GPUTemperatureHigh
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 900, to: 0 }
            model:
              expr: 'nvidia_gpu_temperature_celsius{job="cs2-win"} > 84'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "GTX 1080 Ti above 84 C for 10 minutes", description: "У GTX 1080 Ti с 84 °C начинается сброс частот, около 91 °C — аварийный. Десять минут выше 84 — карте не хватает продува в корпусе сервера: рендер замедлится раньше, чем что-то сломается.", __dashboardUid__: "samoylove-hardware", __panelId__: "71" }

      - uid: hw-link-flap
        title: LinkFlap
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 3600, to: 0 }
            model:
              # Первый час после загрузки не считается: линк поднимается при старте,
              # счётчик начинает с двух перепадов, и 22.09.2026 после перезагрузки
              # тревога горела час без всякой беды с кабелем.
              expr: 'increase(node_network_carrier_changes_total{job="node-host",device="eno1"}[1h]) > 0 and on() (time() - node_boot_time_seconds{job="node-host"}) > 3600'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 0m
        labels: { severity: warning }
        annotations: { summary: "Wired uplink eno1 lost carrier", description: "Проводной линк сервера пропадал за последний час. За неделю до 19.09.2026 было 4 перепада — кабель или порт роутера." }

      - uid: hw-time-not-synced
        title: TimeNotSynced
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 1800, to: 0 }
            model:
              expr: 'node_timex_sync_status{job="node-host"} == 0'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "Host clock is not synchronized", description: "Часы хоста не синхронизированы (NTP). Уехавшие часы ломают TLS, сроки токенов и сопоставление журналов." }

  - orgId: 1
    name: infra-services
    folder: Alerts
    interval: 1m
    rules:
      - uid: infra-service-down
        title: ServiceDown
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: node_systemd_unit_state{name=~"(snakes|chillhub-api|chillhub-admin|nginx|docker)\\.service",state="active"} == 0
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "Unit {{ $labels.name }} is not active", __dashboardUid__: "samoylove-overview", __panelId__: "25" }

      - uid: infra-unit-failed
        title: UnitFailed
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: node_systemd_unit_state{state="failed"} == 1
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "Unit {{ $labels.name }} is in failed state", __dashboardUid__: "samoylove-overview", __panelId__: "25" }

      - uid: infra-monitoring-exporter-down
        title: MonitoringExporterDown
        condition: C
        data:
          - refId: A
            # ServiceDown/UnitFailed смотрят на systemd-юниты хоста, а не на
            # контейнеры самого стека мониторинга — упавший blackbox-exporter
            # или nginxlog-exporter не задел бы ни один systemd-юнит и остался
            # бы незамеченным: SiteDown и посещаемость просто замрут на
            # последнем значении молча, без единого алерта.
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: up{job=~"blackbox-http|nginxlog"} == 0
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Prometheus cannot scrape {{ $labels.job }} — data behind it is stale", __dashboardUid__: "samoylove-overview", __panelId__: "26" }

  - orgId: 1
    name: infra-deploy-events
    folder: Alerts
    interval: 1m
    rules:
      - uid: infra-deploy-event-delivery-stuck
        title: DeployEventDeliveryStuck
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: statusbot_deploy_events_pending_age_seconds > 300
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
