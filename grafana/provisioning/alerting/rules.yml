                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 30m
        labels: { severity: warning }
        annotations: { summary: "Больше пяти кодов закрыто с непустой причиной отказа", description: "Эти матчи в историю игрока уже не попадут: попытки исчерпаны. Разово так бывает у матчей, которых у Valve нет; растущее число означает нашу поломку — чаще всего разбор ответа GC после апдейта игры.", __dashboardUid__: "samoylove-cs2", __panelId__: "207" }
      - uid: cs2-codes-rebind
        title: "CS2: игроку нужно перевыпустить код Steam"
