              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "More than 20 client-side errors reported by the launcher within an hour", __dashboardUid__: "samoylove-chillhub", __panelId__: "36" }

      - uid: product-chillhub-telemetry-rate-limited
        title: ChillhubTelemetryRateLimited
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 3600, to: 0 }
            model:
