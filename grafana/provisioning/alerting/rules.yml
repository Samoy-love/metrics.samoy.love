                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 1h
        labels: { severity: warning }
        annotations: { summary: "Есть просьба стереть данные, которая ждёт дольше суток", description: "Человеку обещали удалить его данные, а удаление не идёт. Скорее всего, стирание оборвалось посередине. Смотреть таблицу erasure_requests и журналы cs2-api и cs2-chain, доводить руками." }

      - uid: cs2-render-heartbeat
        title: "CS2: машина рендера молчит"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: 'cs2_render_heartbeat_age_seconds > 600'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Машина рендера {{ $labels.engine }} молчит больше 10 минут", description: "Её задания без камер уже уходят другим машинам, а ролики с камерами повтора ждут. Смотреть, жив ли работник: на cs2-render это служба в контейнере, на cs2-win — задача планировщика cs2-render и C:\\cs2\\logs\\render.log.", __dashboardUid__: "samoylove-cs2", __panelId__: "1601" }

      - uid: cs2-render-mode-mismatch
        title: "CS2: режим машины рендера не совпадает с сервисом"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              # Обратное расхождение: публичная машина при лабораторном сервисе. Оно
              # только теряет лабораторные ассеты, поэтому warning; опасный случай —
              # правило ниже.
              expr: 'cs2_render_mode_mismatch == 1 unless on() cs2_service_mode{mode="public"} == 1'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "Режим машины рендера {{ $labels.engine }} не совпадает с режимом сервиса", description: "Сервис лабораторный, а машина — нет: ролики с неё выходят без лабораторных ассетов. Вреда людям нет, но решено было иначе. Поправить CS2_MODE в настройках машины и перезапустить работника.", __dashboardUid__: "samoylove-cs2", __panelId__: "1602" }

      - uid: cs2-render-lab-at-public
        title: "CS2: лабораторная машина рендера при публичном сервисе"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              # Машина в лабораторном режиме (CS2_MODE) при публичном сервисе берёт в
              # ролики ассеты без лицензии — ровно то, что рубильник режимов должен был
              # выключить. cs2_render_mode_mismatch различает только «совпадает или нет»;
              # сервис публичный, значит, машина — не публичная. Пять минут — отметка
              # машины идёт раз в полминуты, и перезапуск со старыми настройками не
              # успевает загореться.
              expr: 'cs2_render_mode_mismatch == 1 and on() cs2_service_mode{mode="public"} == 1'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "Машина рендера {{ $labels.engine }} в лабораторном режиме, а сервис публичный", description: "Ролики с этой машины кладут музыку, картинки и голоса без лицензии и уходят людям в публичный сервис. Сразу: остановить работника на этой машине (задания без камер уйдут другой), затем поставить CS2_MODE=public в её настройках и запустить снова. Уже снятые ролики с лабораторными ассетами найти по render_jobs этой машины после смены режима сервиса.", __dashboardUid__: "samoylove-cs2", __panelId__: "1602" }

      - uid: cs2-container-unit-failed
        title: "CS2: в контейнере упала служба"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              # Данные — сборщик incus-units-collect на хосте (репозиторий home-server),
              # textfile node-host, раз в минуту: node_exporter внутри cs2 и cs2-render нет.
              expr: 'incus_container_unit_failed == 1'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "В контейнере {{ $labels.container }} упала служба {{ $labels.unit }}", description: "Что именно перестало работать, зависит от службы: таймер дампа — нет резервной копии, пересчёт — старые числа на страницах, работник рендера — клипы не пишутся. Смотреть journalctl -u {{ $labels.unit }} в контейнере {{ $labels.container }}; после починки systemctl reset-failed." }

      - uid: cs2-container-units-unknown
        title: "CS2: не видно служб контейнера"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: '(time() - incus_container_units_collect_timestamp_seconds > 300) or (incus_container_units_collect_ok == 0)'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "Список служб контейнера не снимается дольше 15 минут", description: "Пока так, тревога про упавшие службы молчит, даже если они упали. Либо контейнер остановлен или завис (метка container), либо встал сам сборщик: systemctl status incus-units-collect.timer на хосте." }

  # --- CI: очередь на своих раннерах -----------------------------------------
  # Данные — сборщик ci-queue-collect на хосте (репозиторий home-server,
  # scripts/ci-queue-collect.py), textfile node-host, опрос GitHub раз в 30 с.
  # Сигнал — возраст САМОГО СТАРОГО ждущего задания, а не число ждущих: пачка
  # из трёх PR ставит в очередь полтора десятка заданий на минуту, и это
  # норма, а одно задание, ждущее десять минут, — нет.
  #
  # noDataState OK у правил очереди безопасен только вместе с последним
  # правилом группы: если сборщик встал, ряды замирают, и об этом говорит
  # CIQueueCollectorStale, а не молчание.
  - orgId: 1
    name: infra-ci
    folder: Alerts
    interval: 1m
    rules:
      - uid: ci-queue-stuck-linux
        title: CIQueueStuckLinux
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: 'max(ci_job_queue_oldest_seconds{pool=~"home-linux|set-heavy"}) > 600'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "A job has been waiting for a home Linux runner for over 10 minutes", description: "Очередь на собственные Linux-раннеры копится: самое старое задание ждёт больше 10 минут. Число раннеров меняет ci-autoscaler: если на панели «Почему не поднимает новых» упор в память — очередь стоит из-за бюджета или хоста (см. CIAutoscalerMemoryBound). Если упора нет, а раннеры есть, — они не берут работу: на хосте ci-autoscaler status и journalctl -u 'ci-runner-cycle@*'.", __dashboardUid__: "samoylove-ci", __panelId__: "17" }

      - uid: ci-queue-stuck-light
        title: CIQueueStuckLight
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: 'max(ci_job_queue_oldest_seconds{pool=~"home-light|set-light"}) > 300'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "A job has been waiting for a light runner for over 5 minutes", description: "Очередь на лёгкие раннеры (метка light; сколько их, решает ci-autoscaler): линтеры, тесты на Node, снимки страниц и покрытие. Работы в таком задании секунды, поэтому пять минут ожидания значат, что лёгких не хватает или они не берут работу. Порог ниже, чем у больших, по той же причине.", __dashboardUid__: "samoylove-ci", __panelId__: "17" }

      - uid: ci-queue-stuck-windows
        title: CIQueueStuckWindows
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: max(ci_job_queue_oldest_seconds{pool="home-windows"}) > 900
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "A job has been waiting for win-builder for over 15 minutes", description: "Задание на Windows-раннер ждёт больше 15 минут, а машине на загрузку хватает минуты. Значит, win-builder не поднялась или раннер на ней офлайн: journalctl -u win-builder-ondemand на хосте, состояние службы раннера в VM (Home Server CLAUDE.md, раздел про win-builder).", __dashboardUid__: "samoylove-ci", __panelId__: "17" }

      - uid: ci-linux-runners-missing
        title: CILinuxRunnersMissing
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 1800, to: 0 }
            model:
              # С 25.09.2026 раннеров столько, сколько поднял ci-autoscaler, и
              # постоянного порога нет: ночью законно два. Сравнивается то, что
              # контроллер считает поднятым и зарегистрированным (свободен или
              # занят), с тем, что видит GitHub. min за 5 минут: одноразовый
              # раннер на секунды уходит в offline при каждом откате.
              expr: 'min_over_time(((sum(ci_autoscaler_slots{state=~"idle|busy"}) or vector(0)) - (sum(ci_runners{os="linux",status="online"}) or vector(0)))[5m:30s]) >= 2'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "Self-hosted Linux runners are up but not registered with GitHub for 15 minutes", description: "Контроллер ci-autoscaler считает минимум двух раннеров поднятыми (процесс раннера жив), а GitHub не видит их в онлайне уже 15 минут. Значит, раннеры не могут до него достучаться или регистрация не проходит, и задания стоят. На хосте: ci-autoscaler status, journalctl -u 'ci-runner-cycle@*'.", __dashboardUid__: "samoylove-ci", __panelId__: "7" }

      - uid: ci-autoscaler-down
        title: CIAutoscalerDown
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              # Такт контроллера — 5 с. Две минуты тишины — служба стоит или
              # висит. absent — метрика пропала совсем (служба не запускалась
              # после перезагрузки или файл метрик удалён).
              expr: '((time() - max(ci_autoscaler_timestamp_seconds)) > 120) or (absent(ci_autoscaler_timestamp_seconds) * 1e6)'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 3m
        labels: { severity: warning }
        annotations: { summary: "The CI runner autoscaler has not completed a cycle for over 2 minutes", description: "ci-autoscaler не закончил такт больше двух минут. Раннеры это переживут: цикл, не видящий свежего пульса контроллера, работает по-старому, класс по имени. Но под очередь новые не поднимутся, лишние не погаснут, а запаркованные слоты так и останутся стоять. На хосте: systemctl status ci-autoscaler, journalctl -u ci-autoscaler.", __dashboardUid__: "samoylove-ci", __panelId__: "45" }

      - uid: ci-autoscaler-memory-bound
        title: CIAutoscalerMemoryBound
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 1800, to: 0 }
            model:
              # Упор в память сам по себе норма пика: контроллер для того и
              # держит бюджет. Тревога — когда из-за него задание ждёт больше
              # 15 минут: тогда либо бюджет мал для нынешней нагрузки, либо
              # хост занят чем-то другим надолго.
              expr: '(max(ci_autoscaler_blocked{reason=~"budget|host"}) == 1) and on() (max(ci_job_queue_oldest_seconds{pool=~"home-linux|home-light|set-heavy|set-light"}) > 900)'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "CI jobs wait over 15 minutes because runners are capped by memory", description: "Задание ждёт раннер больше 15 минут, и контроллер не поднимает новых из-за памяти. Причина budget — сумма потолков раннеров дошла до ci_mem_max в /etc/ci-autoscaler.toml на хосте: поднять бюджет, если хосту хватает. Причина host — память занята не CI (рендер, Windows-машины, прод): смотреть панель «Память инстансов» на панели железа.", __dashboardUid__: "samoylove-ci", __panelId__: "54" }

      - uid: ci-autoscaler-actions-failing
        title: CIAutoscalerActionsFailing
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 1800, to: 0 }
            model:
              expr: 'sum(increase(ci_autoscaler_actions_total{result="fail"}[15m])) >= 3'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 0m
        labels: { severity: warning }
        annotations: { summary: "The CI runner autoscaler keeps failing to act", description: "За 15 минут три и больше действий ci-autoscaler не удались: не создаётся слот, не снимается регистрация через API GitHub, не стартует служба слота или адрес слота не входит в изоляцию (такой слот контроллер не запускает намеренно). Причина — в журнале: journalctl -u ci-autoscaler | grep '!'.", __dashboardUid__: "samoylove-ci", __panelId__: "56" }

      - uid: ci-scaleset-listener-down
        title: CIScaleSetListenerDown
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              # Сессия набора закрыта, слушатель давно не получал ответа
              # (долгий опрос отвечает не реже ~50 с) или метрик нет вовсе.
              expr: '(min(ci_scaleset_session_up) == 0) or ((time() - min(ci_scaleset_last_update_timestamp_seconds)) > 180) or (absent(ci_scaleset_session_up) * 1e6)'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "The runner scale set listener has lost its GitHub session for 5 minutes", description: "Слушатель ci-scaleset не держит сессию набора Runner Scale Set или давно не получал ответа. Задания с runs-on home-heavy или home-light при этом назначаются набору только после переподключения, а контроллер берёт спрос у сборщика очереди (раз в 30 с). После падения сессия занята до минуты — это штатно; дольше — journalctl -u ci-scaleset на хосте.", __dashboardUid__: "samoylove-ci", __panelId__: "58" }

      - uid: ci-queue-collector-stale
        title: CIQueueCollectorStale
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 1800, to: 0 }
            model:
              expr: (time() - max(ci_queue_collect_timestamp_seconds)) > 600 or max(ci_queue_collect_ok) == 0
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "CI queue collector has not reported for 10 minutes", description: "Сборщик очереди раннеров (ci-queue-collect на хосте) не пишет данные или не может опросить GitHub. Пока это так, тревоги об очереди молчат. На хосте: systemctl status ci-queue-collect.timer, journalctl -u ci-queue-collect.", __dashboardUid__: "samoylove-ci", __panelId__: "13" }

  # --- Мониторинг сам о себе -------------------------------------------------
  # Ревью панелей 19.09.2026 нашло, что у части целей сбора нет ни одного
  # правила на up: prometheus, grafana, node, snakes и оба процесса chillhub
  # могли выпасть из сбора молча, и панели просто замирали. У остальных целей
  # (node-host, incus, blackbox, nginxlog, cs2-api) правила уже есть в своих
  # группах — здесь они исключены, чтобы не слать двух сообщений об одном.
  - orgId: 1
    name: infra-monitoring
    folder: Alerts
    interval: 1m
    rules:
      - uid: mon-scrape-target-down
        title: ScrapeTargetDown
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: 'up{job!~"node-host|incus|blackbox-http|nginxlog|cs2-api|cs2-win"} == 0'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "A scrape target has been down for 5 minutes", description: "Prometheus не может снять метрики с цели (метка job). Панели этой цели замерли на последних значениях, а тревоги по её метрикам молчат. Для snakes и chillhub частая причина — ограничение сети в юните сервиса (README, «Как добавить цель сбора»)." }

      - uid: mon-prometheus-reload-failed
        title: PrometheusConfigReloadFailed
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: 'prometheus_config_last_reload_successful == 0'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Prometheus failed to reload its configuration", description: "Prometheus работает на старом конфиге: изменения целей из последней выкатки не применились. Смотреть журнал контейнера samoylove-prometheus." }

      - uid: mon-grafana-rule-eval-failing
        title: GrafanaRuleEvaluationFailing
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 1800, to: 0 }
            model:
              expr: 'sum(increase(grafana_alerting_rule_evaluation_failures_total[30m])) > 0'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "Grafana fails to evaluate alert rules", description: "Правило, которое не вычисляется, не видит того, что должно сторожить. Какое именно — страница /alerting/list, состояние Error." }

      - uid: mon-host-textfile-stale
        title: HostTextfileStale
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 1800, to: 0 }
            model:
              expr: 'time() - node_textfile_mtime_seconds{job="node-host"} > 1800'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "A textfile metrics file on the host has not been updated for 30 minutes", description: "Сборщик на хосте завис или его таймер встал (файл — метка file: smart.prom и zfs.prom пишет node-textfile-collect раз в 5 минут, ci.prom — ci-queue-collect раз в 30 секунд). Старые значения при этом выглядят живыми, и SmartCollectFailing молчит." }

      - uid: mon-scrape-target-missing
        title: ScrapeTargetMissing
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 1800, to: 0 }
            model:
              expr: 'absent(up{job="node-host"}) or absent(up{job="incus"}) or absent(up{job="cs2-api"})'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "A file_sd scrape target disappeared", description: "Цель из file_sd пропала целиком: файл /etc/prometheus/targets/*.yml опустел или удалён. up == 0 при этом не бывает, поэтому остальные тревоги молчат." }

      - uid: mon-prometheus-ingestion-stopped
        title: PrometheusIngestionStopped
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 900, to: 0 }
            model:
              expr: 'sum(rate(prometheus_tsdb_head_samples_appended_total[5m])) == 0'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "Prometheus stopped ingesting samples", description: "Сбор встал целиком: все панели замерли, а тревоги смотрят на устаревшие данные. Журнал контейнера samoylove-prometheus." }

      - uid: mon-prometheus-tsdb-failures
        title: PrometheusTsdbFailures
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 3600, to: 0 }
            model:
              expr: '(increase(prometheus_tsdb_compactions_failed_total[1h]) + increase(prometheus_tsdb_wal_corruptions_total[1h]) + increase(prometheus_tsdb_wal_writes_failed_total[1h])) > 0'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 0m
        labels: { severity: warning }
        annotations: { summary: "Prometheus TSDB reports compaction or WAL failures", description: "Хранилище Prometheus портится: сбой уплотнения или журнала WAL. История может пропасть — смотреть журнал контейнера и место на томе." }

      - uid: mon-prometheus-tsdb-near-limit
        title: PrometheusTsdbNearSizeLimit
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 7200, to: 0 }
            model:
              expr: 'prometheus_tsdb_storage_blocks_bytes / prometheus_tsdb_retention_limit_bytes > 0.85'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
