        annotations: { summary: "Steam отверг код аутентификации у одного из игроков", description: "У этого человека история матчей остановилась совсем: новые матчи не находятся, разбора не будет. Починить может ТОЛЬКО он сам — взять новый код на странице помощи Steam, — и, значит, сказать ему об этом должны мы.", __dashboardUid__: "samoylove-cs2", __panelId__: "205" }
      - uid: cs2-worker-disabled
        title: "CS2: работник цепочки выключен"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: 'cs2_worker_enabled{worker=~"коды|сводки|скачивание"} == 0'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 30m
        labels: { severity: warning }
        annotations: { summary: "Работник {{ $labels.worker }} не запущен: нет настройки или ключа", description: "Матчи перестают приходить сами, а страницы объясняют пустоту ОЖИДАНИЕМ — то есть врут: ждать нечего. 09.09.2026 живой игрок так ждал разбора, которого не случилось бы никогда. Проверить CS2_GC_URL, ключ Steam и список хостов скачивателя в /etc/cs2/api.env.", __dashboardUid__: "samoylove-cs2", __panelId__: "400" }
      - uid: cs2-demo-storage-low
        title: "CS2: место под демки кончается"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              # ПОРОГ ВЫБРАН НЕ КРУГЛЫМ ЧИСЛОМ, А ПОВЕДЕНИЕМ СЛУЖБЫ: скачиватель
              # не начинает круг, если свободно меньше десяти гигабайт (иначе он
              # забивает диск за сутки — тихо и сразу у всех, включая разбор с
              # его временными файлами). Пятнадцать — это «осталось несколько
              # демок до остановки», то есть время что-то сделать.
              expr: '(cs2_demo_storage_total_bytes - cs2_demo_storage_used_bytes) / 1024^3 < 15'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "Под демки осталось меньше 15 ГБ: скачиватель встанет на десяти", description: "Демки хранятся целиком и без срока — это решение, а не недосмотр, и защита пула здесь квота, а не удаление. Ниже десяти гигабайт скачиватель перестаёт начинать круги: матчи продолжат находиться, но файлы за ними приходить перестанут, а окно Valve — тридцать дней. Решать владельцу: расширить квоту ZFS или разобраться, что занимает место.", __dashboardUid__: "samoylove-cs2", __panelId__: "402" }
      - uid: cs2-demo-storage-forecast
        title: "CS2: места под демки хватит меньше чем на две недели"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 266400, to: 0 }
            model:
              # Предсказание по трём дням роста на две недели вперёд. Это
              # ПРЕДУПРЕЖДЕНИЕ, А НЕ ФАКТ, и рядом с ним всегда стоит настоящий
              # остаток из соседнего правила.
              #
              # Наклон берётся по скользящему минимуму за два часа, а не по
              # сырому ряду. 21.09.2026 занятое место на полтора часа выросло
              # с 10 до 29 ГБ при тех же 66 демках — временные файлы, а не
              # новые матчи, — и шестичасовое окно продолжило этот час на две
              # недели: правило горело два часа на пустом месте. Всплеск
              # короче двух часов минимум не видит вовсе, а настоящий рост
              # демками от него не прячется — демки не удаляются.
              expr: 'predict_linear(min_over_time(cs2_demo_storage_used_bytes[2h])[3d:10m], 14*24*3600) > cs2_demo_storage_total_bytes - 10 * 1024^3'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 1h
        labels: { severity: info }
        annotations: { summary: "При нынешнем темпе места под демки хватит меньше чем на две недели", description: "Наклон взят по последним трём дням (без всплесков короче двух часов) и продолжен на две недели — это повод посмотреть, а не тревога: неделя активной игры задирает темп, а неделя без игры его обнуляет. Настоящий остаток — в правиле «место под демки кончается».", __dashboardUid__: "samoylove-cs2", __panelId__: "402" }
      - uid: cs2-worker-silent
        title: "CS2: работник цепочки молчит"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              # ВЫКЛЮЧЕННЫЕ ОТСЕИВАЮТСЯ, А НЕ ВКЛЮЧЁННЫЕ ОТБИРАЮТСЯ. Метрика
              # cs2_worker_enabled есть только у работников с рубильником, и
              # отбор по ней выбрасывал «разбор» — того единственного, чьё
              # молчание и значит, что матчи не разбираются.
              expr: |
                (time() - cs2_worker_last_success_timestamp_seconds > 21600)
                and on(worker) cs2_worker_backlog > 0
                unless on(worker) cs2_worker_enabled == 0
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 30m
        labels: { severity: warning }
        annotations: { summary: "Работник {{ $labels.worker }} шесть часов не сделал ни одного дела, хотя его ждут дела", description: "Работник запущен, очередь у него непустая (cs2_worker_backlog), а следов работы в базе шесть часов нет: круг падает молча. Для игрока это затор в цепочке без единой ошибки в журнале. Тишина при пустой очереди — норма (никто не играл) и тревогой не считается: до 11.09.2026 правило этого не различало и горело весь вечер.", __dashboardUid__: "samoylove-cs2", __panelId__: "401" }
      - uid: cs2-worker-mark-silent
        title: "CS2: фоновый работник молчит"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              # Работники с отметкой удачного круга в service_marks (worker:<имя>), у
              # которых нет очереди: общее правило «работник цепочки молчит» требует
              # непустой cs2_worker_backlog и их не видит. Порог у каждого — не меньше
              # двух пропущенных кругов, чтобы одна заминка чужой стороны не будила
              # (МЕТРИКИ.md, «Работники и их отметки»):
              #   блокировки, уровни, профили — круг час, порог три часа; у частей
              #     рубильник один, cs2_worker_enabled{worker="профили"};
              #   faceit — круг полчаса, порог два часа;
              #   друзья — долгий опрос 25 с, порог 15 минут;
              #   пересчёт — круг 15 минут, порог час;
              #   аватары — проход раз в сутки на сайте, порог 50 часов, рубильника нет.
              # профиль_вошедшего не тревожит намеренно: сбор идёт, только когда человек
              # входит или жмёт «обновить», и тишина значит «никто не входил».
              # Ряд, оставшийся от времени, когда ключ был, не будит: сверка с
              # cs2_worker_enabled того же работника.
              expr: |
                (
                  (time() - max by (worker) (cs2_worker_last_success_timestamp_seconds{worker=~"блокировки|уровни|профили"}) > 10800)
                    and on() (max(cs2_worker_enabled{worker="профили"}) == 1)
                )
                or (
                  (time() - max by (worker) (cs2_worker_last_success_timestamp_seconds{worker="faceit"}) > 7200)
                    and on(worker) (max by (worker) (cs2_worker_enabled{worker="faceit"}) == 1)
                )
                or (
