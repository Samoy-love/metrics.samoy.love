              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "За последний час заказ клипа провалился окончательно", description: "Человек клипа не получит: попытки исчерпаны (три) или отказ окончательный сразу — битая демка, неизвестный вид, игрока нет в матче. Причина словами лежит в render_jobs.error и в journalctl -u cs2-render контейнера cs2-render. Серия провалов подряд — не демки, а сама игра: обновление CS2, отвалившийся Steam, кончившееся место под кадры.", __dashboardUid__: "samoylove-cs2", __panelId__: "902" }
      - uid: cs2-render-stalled
        title: "CS2: очередь клипов стоит"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              # Возраст самого старого заказа: ноль при пустой очереди, так что
              # тишина работника без заказов тревогой не считается. Полчаса —
              # это холодный старт игры (полторы минуты) и десяток заданий
              # впереди с запасом; дольше ждёт только стоящая очередь.
              expr: 'cs2_render_oldest_queued_seconds > 1800'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "Самый старый заказ клипа ждёт дольше получаса", description: "Заказы есть, а работник рендера их не берёт: контейнер cs2-render выключен, служба упала, Steam не вошёл или игра не поднялась после обновления. Для человека это клип, который «готовится» бесконечно. Смотреть systemctl status cs2-render и экран игры по VNC в /admin; задание с истёкшей арендой работник переберёт сам после перезапуска.", __dashboardUid__: "samoylove-cs2", __panelId__: "903" }
      - uid: cs2-render-promo-late
        title: "CS2: промо не успевает к сводке неделю подряд"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              # Не авария, а порог мощности: доля промо, снятых до сводки сессии, ниже
              # 95% ВСЮ неделю (максимум за семь суток ниже порога) — пора третья машина
              # (КОНСТРУКТОР-РОЛИКОВ, «Мощность рендера»). Метрика — скользящие сутки,
              # так что неделя берётся подзапросом по часу, а не for: 7d, который
              # обнуляется перезапуском Grafana. Условие на число часов с промо —
              # чтобы новая метрика или неделя почти без промо не решали по двум
              # заданиям. Ожидание по классам (cs2_render_waiting_seconds) отдельной
              # тревоги не получает: стоящую очередь ловит «очередь клипов стоит», а
              # нехватку мощности — это правило.
              expr: 'max_over_time((max(cs2_render_promo_day{state="in_time"}) / (sum(max by (state) (cs2_render_promo_day)) > 0))[7d:1h]) < 0.95 and count_over_time((sum(max by (state) (cs2_render_promo_day)) > 0)[7d:1h]) >= 120'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 1h
        labels: { severity: warning }
        annotations: { summary: "Неделю подряд больше 5% промо снимаются уже после сводки сессии", description: "Опоздавшее промо в Telegram не уходит: человек получает сводку без ролика. Две машины не справляются с вечерним пиком — пора третья (КОНСТРУКТОР-РОЛИКОВ, «Мощность рендера»). Сначала глянуть «Ожидание по классам» и «Машины рендера: отметка»: если одна машина всю неделю молчала, дело не в мощности.", __dashboardUid__: "samoylove-cs2", __panelId__: "1604" }
      - uid: cs2-clip-storage-low
        title: "CS2: место под клипы кончается"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              # Датасет tank/cs2-clips с квотой 40 ГиБ; ниже двух гигабайт остатка
              # работник заказов не берёт. Порог — четыре: за день до остановки
              # при темпе «десяток клипов Full HD в час».
              expr: '(cs2_clip_storage_total_bytes - cs2_clip_storage_used_bytes) / 1024^3 < 4 and cs2_clip_storage_total_bytes > 0'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "Под клипы осталось меньше 4 ГБ: работник рендера встанет на двух", description: "Клипы стираются сами через месяц без обращений, так что это либо всплеск заказов, либо сироты — каталоги без записи в реестре (панель «Клипы: занято» покажет расхождение). Ниже двух гигабайт заказы перестают браться, и у людей клип «готовится» бесконечно. Решать владельцу: расширить квоту ZFS датасета tank/cs2-clips или укоротить срок жизни CS2_RENDER_CLIP_TTL.", __dashboardUid__: "samoylove-cs2", __panelId__: "908" }
      # --- Здоровье машин рендера (ревью мощности 23.09.2026). Метрики по
      # машинам несут метку engine (linux, hlae), и выражения её не сводят:
      # тревога приходит отдельно по каждой машине, потому что чинятся они
      # порознь — контейнер cs2-render и Windows-машина cs2-win.
      - uid: cs2-render-first-try-low
        title: "CS2: рендер часто не получается с первого раза"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              # Доля считается сервисом по неделе завершённых заданий, так что
              # сама по себе уже сглажена; сутки ниже порога — не случайность
              # одного вечера, а причина, которая держится.
              expr: 'cs2_render_first_try_ratio < 0.9'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 24h
        labels: { severity: warning }
        annotations: { summary: "Меньше 90% заданий рендера за неделю прошли с первой попытки (машина — метка engine)", description: "Клипы в итоге доходят, но каждый повтор — лишние минуты, пока игрок ждёт. Какая причина выросла, видно в cs2_render_retries_week по той же машине (панель «Рендер с первого раза: причины повторов»): перемотка, камера, падение игры, HLAE, диск, потолок времени (timeout). Частый повод — обновление CS2 или выкатка посреди задания.", __dashboardUid__: "samoylove-cs2", __panelId__: "910" }
      - uid: cs2-render-engine-broken
        title: "CS2: движок съёмки сломан"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: 'cs2_render_engine_ok == 0'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        # Два часа, а не час: проба после обновления CS2 успевает отработать
        # и перезапуск игры, и повторную проверку — будит только то, что само
        # не поднялось.
        for: 2h
        labels: { severity: warning }
        annotations: { summary: "Проба движка съёмки не проходит дольше двух часов (движок — метка engine)", description: "У hlae это значит, что камеры повтора не работают: обычные заказы уходят на Linux, а ролики с камерами ждут. Почти всегда причина — обновление CS2, под которое HLAE ещё не вышла или не поставлена. Если одновременно горит «вышла новая версия HLAE» — ставить её на cs2-win и гонять стенд. Журнал — C:\\cs2\\logs\\render.log на cs2-win.", __dashboardUid__: "samoylove-cs2", __panelId__: "911" }
      - uid: cs2-render-machine-space-low
        title: "CS2: на машине рендера кончается место"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              # Меньшее из каталога клипов и рабочих каталогов машины; на
              # Windows это разные диски. Десять гибибайт — раньше, чем в
              # восьми сборщик начнёт стирать клипы сверх сроков.
              expr: 'cs2_render_clips_free_bytes < 10 * 1024^3'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "На машине рендера меньше 10 ГиБ свободного места (машина — метка engine)", description: "Ниже 8 ГиБ в каталоге клипов сборщик начнёт стирать клипы раньше срока, ниже 2 ГиБ где угодно машина перестанет брать задания, и клипов не получит никто. На cs2-win смотреть оба диска: Z: (клипы) и C: (дорожки, кэш демок). Это не квота датасета tank/cs2-clips — про неё отдельная тревога «место под клипы кончается».", __dashboardUid__: "samoylove-cs2", __panelId__: "912" }
      - uid: cs2-render-hlae-update
        title: "CS2: вышла новая версия HLAE"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: 'cs2_render_engine_update == 1'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 1h
        # info идёт общим маршрутом: напоминание раз в сутки, пока версия
        # не поставлена.
        labels: { severity: info }
        annotations: { summary: "Вышла HLAE новее той, что стоит на машине рендера", description: "Само по себе это не поломка: пока движок исправен, обновление можно отложить. Срочно — только вместе с тревогой «движок съёмки сломан»: тогда новая версия, скорее всего, и есть починка после обновления CS2. Ставить на cs2-win и прогонять стенд.", __dashboardUid__: "samoylove-cs2", __panelId__: "911" }
      - uid: cs2-render-game-update-stuck
        title: "CS2: обновление игры на машине рендера не встало"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              # На cs2-win HLAE запускает cs2.exe мимо Steam, и скачанное
              # обновление не встанет никогда — полчаса хватает, чтобы не
              # будить на время самой закачки. На Linux Steam ставит сам:
              # три часа — это уже вставший клиент Steam.
              expr: 'cs2_render_game_update_seconds{engine="hlae"} > 1800 or cs2_render_game_update_seconds{engine="linux"} > 10800'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Steam ждёт поставить обновление CS2 на машине рендера (машина — метка engine)", description: "Пока оно не встало, новые демки не читаются старой игрой, а новая HLAE, собранная под новую игру, её не поднимает. На cs2-win: мягко остановить работника (C:\\cs2\\stop-render.ps1), запустить CS2 через Steam разовой задачей в сеансе render (steam://run/730), дождаться, когда buildid в appmanifest_730.acf сравняется с TargetBuildID, погасить игру и запустить задачу cs2-render — проба при старте проверит движок. Если HLAE под новую игру ещё нет, проба упадёт, и заказы уйдут на Linux. На Linux — смотреть клиент Steam в cs2-render. Карточка машины в админке cs2 пишет, какая сборка ждёт.", __dashboardUid__: "samoylove-cs2", __panelId__: "911" }

      - uid: cs2-chain-no-leader
        title: "CS2: цепочку никто не ведёт"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 1200, to: 0 }
            model:
              expr: 'max(cs2_chain_leader{state="leading"}) == 0 and on() max(cs2_chain_scrape_up) == 1'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: critical }
        annotations: { summary: "Ни один процесс не держит замок цепочки матчей", description: "Матчи перестают приходить сами, а сайт при этом выглядит здоровым. Проверить cs2-chain в контейнере cs2: запущен ли, не завис ли на замке в Postgres." }

      - uid: cs2-chain-scrape-down
        title: "CS2: цепочка не отвечает на сбор"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 1800, to: 0 }
            model:
              expr: 'avg_over_time(cs2_chain_scrape_up[15m]) < 0.5'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "Сайт не может снять метрики процесса цепочки", description: "Числа работников на дашборде становятся нулями сайта, и часть тревог про цепочку врёт. Проверить, жив ли cs2-chain и отвечает ли его порт метрик." }

      - uid: cs2-worker-panics
        title: "CS2: работник падает с паникой"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 1800, to: 0 }
            model:
              expr: 'sum by (worker) (increase(cs2_worker_panics_total[30m])) >= 2'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 0m
        labels: { severity: warning }
        annotations: { summary: "Работник цепочки паникует", description: "Работник ловит панику и перезапускается — задание, на котором он падает, не пройдёт никогда. Порог 2, а не 1: сумма счётчиков сайта и цепочки даёт ложный прирост при выкатке. Журнал cs2-chain, строка с паникой." }

      - uid: cs2-reports-behind
        title: "CS2: документы отчёта не догоняют"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 7200, to: 0 }
            model:
              expr: 'cs2_reports_outdated > 0 and deriv(cs2_reports_outdated[1h]) >= 0'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 6h
        labels: { severity: warning }
        annotations: { summary: "Пересчёт документов отчёта встал", description: "Страницы матчей считаются на лету и медленнее, пока документы устаревшие. Проверить работника пересчёта." }

      - uid: cs2-steam-rate
        title: "CS2: ключ Steam упирается в темп"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 1800, to: 0 }
            model:
              expr: 'max(cs2_budget_used{resource="steam_key",window="10с"}) / (10 * max(cs2_external_limit{limit="steam_вызовов_в_секунду"})) > 0.9'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 30m
        labels: { severity: warning }
        annotations: { summary: "Вызовы Steam идут на пределе частоты", description: "Страницы ждут Steam: фоновый сбор занял почти весь темп ключа. Смотреть расход по работникам на дашборде cs2." }

      - uid: cs2-admin-login-bruteforce
        title: "CS2: кто-то подбирает пароль админки"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 900, to: 0 }
            model:
              # Вход закрывается после пяти неверных паролей за 15 минут, и
              # каждая следующая попытка — blocked. Владелец ошибается раз-другой;
              # пять неверных подряд или упор в закрытый вход — перебор.
              expr: '(sum(increase(cs2_admin_login_total{result="blocked"}[15m])) > 0) or (sum(increase(cs2_admin_login_total{result="wrong"}[15m])) >= 5)'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 0m
        labels: { severity: warning }
        annotations: { summary: "Кто-то подбирает пароль админки cs2", description: "За 15 минут пять и больше неверных паролей к /admin или попытка при уже закрытом входе. Если это не ты — кто-то перебирает пароль владельца: вход сам закрыт на 15 минут, но стоит посмотреть журнал cs2-api и журнал nginx и сменить пароль.", __dashboardUid__: "samoylove-cs2", __panelId__: "1202" }

      # --- Сохранность данных, базы и машины рендера ----------------------
      # Метрики появились в cs2 25.09.2026. До выкатки сервиса их рядов нет,
      # поэтому у всех noDataState OK: молчание здесь значит «ещё не пришло»,
      # а не «сломалось». Исключение одно — отметка дампа, см. её правило.
      - uid: cs2-parse-postponed
        title: "CS2: ClickHouse не принимает разбор"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: 'cs2_parse_postponed > 0'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 1h
        labels: { severity: critical }
        annotations: { summary: "Разборы откладываются больше часа: ClickHouse не принимает запись", description: "Свежие матчи не появляются ни на сайте, ни в боте. Задания при этом не пропадают: каждое ждёт и пробует снова. Смотреть ClickHouse в контейнере cs2: жив ли, есть ли место, нет ли TOO_MANY_PARTS в журнале cs2-chain.", __dashboardUid__: "samoylove-cs2", __panelId__: "1502" }

      - uid: cs2-parse-failed-seen
        title: "CS2: упавшие разборы спрятали матчи"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: 'cs2_parse_failed_seen > 0'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 6h
        labels: { severity: warning }
        annotations: { summary: "Есть упавшие разборы уже виденных матчей", description: "Человек этот матч уже видел, а теперь он пропал со страниц: перезапись стёрла старые строки и не записала новые. Сам матч не вернётся, пока разбор не пройдёт. Причину искать в parse_jobs.error у упавших заданий.", __dashboardUid__: "samoylove-cs2", __panelId__: "1503" }

      - uid: cs2-parse-deleting-stuck
        title: "CS2: удаление матча застряло"
