        labels: { severity: warning }
        annotations: { summary: "Удаление матча оборвалось и не доделано", description: "Данные, которые человек просил стереть, всё ещё лежат. Подметальщик не справился за час: смотреть журнал cs2-chain (recheck) и доделывать руками.", __dashboardUid__: "samoylove-cs2", __panelId__: "1504" }

      - uid: cs2-reconcile-mismatch
        title: "CS2: базы и диск разошлись"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              # parse_missing сюда не входит: такие матчи сверка сама ставит на разбор
              # заново, и для них есть отдельное правило с порогом. summary тоже:
              # это не расхождение хранилищ, а регресс разбора, правило своё.
              expr: 'cs2_reconcile_mismatches{kind=~"clickhouse_orphan|file_orphan|row_no_file"} > 0'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 1h
        labels: { severity: warning }
        annotations: { summary: "Ночная сверка нашла расхождение баз и диска (вид — метка kind)", description: "Сверка только считает, удалять данные без человека ей нельзя. clickhouse_orphan — строки матча без задания, file_orphan — файл демки без записи, row_no_file — запись без файла, то есть демку уже не перечитать. Разбирать руками, начиная с row_no_file.", __dashboardUid__: "samoylove-cs2", __panelId__: "1505" }

      - uid: cs2-reconcile-parse-missing
        title: "CS2: много матчей без строк в ClickHouse"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: 'cs2_reconcile_mismatches{kind="parse_missing"} > 10'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 1h
        labels: { severity: warning }
        annotations: { summary: "Больше десяти матчей помечены разобранными, а строк у них нет", description: "Сверка сама ставит их на разбор заново, но пока разбор не пройдёт, у людей пустые страницы матчей. Один-два — случайность, десяток — ClickHouse терял запись. Проверить, что повторные разборы проходят, и искать, куда делись строки.", __dashboardUid__: "samoylove-cs2", __panelId__: "1505" }

      - uid: cs2-reconcile-summary
        title: "CS2: разбор разошёлся со сводкой Valve"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              # Ночная сверка сравнивает убийства, смерти, помощь и счёт матчей,
              # разобранных за трое суток, со сводкой Game Coordinator. У исправного
              # разбора расхождений нет, так что порог — ноль: любое число после выкатки
              # или обновления CS2 значит, что разбор считает не то. Значение держится
              # сутки до следующей сверки; час — чтобы пересчёт посреди выкатки не будил.
              expr: 'max(cs2_reconcile_mismatches{kind="summary"}) > 0'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 1h
        labels: { severity: warning }
        annotations: { summary: "Ночная сверка нашла матчи, где разбор не совпал со сводкой Valve", description: "У людей на страницах матча не те убийства, смерти или счёт, что показывает сама игра. Обычная причина — обновление CS2 или свежая выкатка разбора. Первые двадцать расхождений (матч, номер GC, SteamID, два числа) — в журнале cs2-chain у recheck; сверить с демкой и чинить разбор, данные сами не правятся.", __dashboardUid__: "samoylove-cs2", __panelId__: "1505" }

      - uid: cs2-pg-dump-old
        title: "CS2: дамп Postgres давно не снимался"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              # 26 часов: дамп ежедневный, и два часа запаса покрывают разброс
              # таймера и длительность самого дампа. Полтора суток (прежний
              # порог) означали, что о пропущенном дампе узнаёшь к вечеру
              # следующего дня, когда без копии прожиты уже сутки.
              expr: 'cs2_pg_dump_age_seconds > 93600'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 30m
        labels: { severity: warning }
        annotations: { summary: "Последний удачный дамп Postgres старше 26 часов", description: "Дамп снимается каждый день, значит, вчерашний не удался. Если сейчас потерять базу, пропадут учётные записи, коды и очередь с последнего дампа. Смотреть cs2-pgdump в контейнере cs2: таймер, журнал, место под дампы.", __dashboardUid__: "samoylove-cs2", __panelId__: "1501" }

      - uid: cs2-pg-dump-absent
        title: "CS2: отметки дампа Postgres нет"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              # Здесь отсутствие ряда и есть беда: отметки нет, пока дамп ни разу не
              # удался. Двое суток — чтобы свежая выкатка дождалась первого ночного
              # дампа и не будила зря.
              expr: 'absent(cs2_pg_dump_age_seconds)'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 48h
        labels: { severity: warning }
        annotations: { summary: "Сервис не видит ни одного удачного дампа Postgres", description: "Похоже, резервной копии базы нет вовсе. Проверить, что таймер cs2-pgdump включён в контейнере cs2 и что скрипт пишет отметку в service_marks. Если лежит сам сайт, рядом горит «сайт не отвечает» — начинать с него.", __dashboardUid__: "samoylove-cs2", __panelId__: "1501" }

      - uid: cs2-pg-connections
        title: "CS2: соединения Postgres на исходе"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: 'cs2_postgres_connections{state="used"} / ignoring(state) cs2_postgres_connections{state="max"} > 0.8'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Занято больше 80% соединений Postgres", description: "Когда кончатся все, запросы сайта и цепочки начнут падать с ошибкой: страницы не откроются, разбор встанет. Смотреть pg_stat_activity: кто держит соединения и не утекают ли они." }

      - uid: cs2-clickhouse-parts
        title: "CS2: куски ClickHouse копятся"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: 'cs2_clickhouse_parts{scope="max_partition"} > 200'
